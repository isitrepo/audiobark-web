<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E8963A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AudioBark">
  <meta name="description" content="AudioBark: an audiobook player made for the Dog Park Book Club.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>AudioBark</title>
</head>
<body>
  <!-- Icons used across the app -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></symbol>
    <symbol id="i-rew" viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></symbol>
    <symbol id="i-ff" viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></symbol>
    <symbol id="i-back10" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></symbol>
    <symbol id="i-fwd10" viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/></symbol>
    <symbol id="i-arrow-back" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></symbol>
    <symbol id="i-add" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12.34 2.02C6.59 1.82 2 6.42 2 12c0 5.52 4.48 10 10 10 3.71 0 6.93-2.02 8.66-5.02-7.51-.25-12.09-8.43-8.32-14.96z"/></symbol>
    <symbol id="i-speed" viewBox="0 0 24 24"><path d="M20.38 8.57l-1.23 1.85a8 8 0 0 1-.22 7.58H5.07A8 8 0 0 1 15.58 6.85l1.85-1.23A10 10 0 0 0 3.35 19a2 2 0 0 0 1.72 1h13.85a2 2 0 0 0 1.74-1 10 10 0 0 0-.27-10.44zm-9.79 6.84a2 2 0 0 0 2.83 0l5.66-8.49-8.49 5.66a2 2 0 0 0 0 2.83z"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></symbol>
    <symbol id="i-delete" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></symbol>
  </svg>

  <!-- Library -->
  <section id="library" class="view">
    <header class="bar">
      <h1>AudioBark</h1>
      <button class="icon-btn" id="btnImport" aria-label="Import book"><svg><use href="#i-add"/></svg></button>
      <button class="icon-btn" id="btnSettings" aria-label="Settings"><svg><use href="#i-settings"/></svg></button>
    </header>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="new">New</button>
      <button role="tab" data-tab="started" class="on">Started</button>
      <button role="tab" data-tab="finished">Finished</button>
    </nav>
    <main id="bookList" class="list"></main>
    <div id="empty" class="empty" hidden>
      <p>No books yet.</p>
      <p class="hint">Tap <b>Import book</b>, then pick the book's audio files from the Files app
        (for a folder of mp3s: <b>Select → Select All</b>). Add a cover picture too if you have one.</p>
      <button class="btn primary" id="btnImportEmpty">Import book</button>
    </div>
    <footer id="mini" class="mini" hidden>
      <div class="cover small" id="miniCover"></div>
      <div class="mini-title" id="miniTitle"></div>
      <button class="icon-btn" id="miniPlay" aria-label="Play"><svg><use href="#i-play"/></svg></button>
    </footer>
  </section>

  <!-- Player -->
  <section id="player" class="view" hidden>
    <header class="bar">
      <button class="icon-btn" id="btnBack" aria-label="Back to library"><svg><use href="#i-arrow-back"/></svg></button>
      <h2 id="pTitle" class="ellipsis"></h2>
      <button class="icon-btn" id="btnBookmarkAdd" aria-label="Add bookmark"><svg><use href="#i-bookmark"/></svg></button>
      <button class="icon-btn" id="btnBookmarks" aria-label="Bookmarks"><svg><use href="#i-list"/></svg></button>
    </header>
    <div class="cover-wrap">
      <button class="cover big" id="pCover" aria-label="Play or pause">
        <span class="overlay" id="pOverlay"><svg><use href="#i-play"/></svg></span>
      </button>
    </div>
    <div class="now">
      <div id="pChapter" class="chapter-title"></div>
      <button id="pChapterNo" class="link"></button>
    </div>
    <input type="range" id="pSeek" min="0" max="1000" value="0" aria-label="Position in chapter">
    <div class="times">
      <span id="pPos">0:00</span>
      <button class="link" id="btnGoTo">Go to time</button>
      <span id="pLeft">-0:00</span>
    </div>
    <div class="controls">
      <button class="jump" data-jump="-60"><svg><use href="#i-rew"/></svg><span>1 min</span></button>
      <button class="jump" data-jump="-10"><svg><use href="#i-back10"/></svg><span>10 s</span></button>
      <button class="play" id="pPlay" aria-label="Play"><svg><use href="#i-play"/></svg></button>
      <button class="jump" data-jump="10"><svg><use href="#i-fwd10"/></svg><span>10 s</span></button>
      <button class="jump" data-jump="60"><svg><use href="#i-ff"/></svg><span>1 min</span></button>
    </div>
    <div class="row">
      <button class="icon-btn" id="pPrevCh" aria-label="Previous chapter"><svg><use href="#i-prev"/></svg></button>
      <button class="chip" id="pSpeed"><svg><use href="#i-speed"/></svg><span>1×</span></button>
      <button class="chip" id="pSleep"><svg><use href="#i-moon"/></svg><span>Sleep</span></button>
      <button class="icon-btn" id="pNextCh" aria-label="Next chapter"><svg><use href="#i-next"/></svg></button>
    </div>
  </section>

  <input type="file" id="filePicker" multiple hidden>
  <dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
